name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build, Test and Deploy Job

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # --------------------------------
      # Run Angular Unit Tests
      # --------------------------------
      - name: Run Angular Unit Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # --------------------------------
      # Build Angular
      # --------------------------------
      - name: Build Angular
        run: npm run build

      # --------------------------------
      # Verify Angular build
      # --------------------------------
      - name: Verify Angular build
        run: |
          echo "Checking Angular build output..."

          ls -la dist
          ls -la dist/searchoptions
          ls -la dist/searchoptions/browser

          test -f dist/searchoptions/browser/index.html

          echo "Angular build verified successfully."

      # --------------------------------
      # Deploy to Azure Static Web Apps
      # --------------------------------
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_FIELD_0A48BED0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          app_location: "/dist/searchoptions/browser"
          output_location: ""
          skip_app_build: true

  # --------------------------------
  # Close Pull Request
  # --------------------------------
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_FIELD_0A48BED0F }}
          action: "close"
